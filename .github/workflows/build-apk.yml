name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Debug - Show directory structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== frontend/www ==="
          ls -la frontend/www/ || echo "frontend/www not found"
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json

      - name: Sync Capacitor to Android
        run: |
          npx cap sync android --verbose 2>&1 || true
          echo "Exit code: $?"

      - name: Check android folder after sync
        run: |
          echo "=== android/capacitor-android exists? ==="
          ls android/ || echo "android not found"
          echo "=== assets ==="
          ls android/app/src/main/assets/ || echo "assets folder empty"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecruitEdu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
